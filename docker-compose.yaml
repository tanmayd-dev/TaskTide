services:
  postgres:
    image: docker.io/library/postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: TaskTide
    ports:
      - "55432:5432"
    volumes:
      - TaskTide:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: docker.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"

  migration:
    build:
      context: .
      dockerfile: migrations.DOCKERFILE
    volumes:
      - ./migrations:/app/migrations
    working_dir: /app
    environment:
      - GOOSE_DRIVER=postgres
      - GOOSE_DBSTRING=postgres://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/TaskTide?sslmode=disable
      - GOOSE_MIGRATION_DIR=migrations
    command: up
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: 
      context: .
      args:
        - APP_NAME=api
      dockerfile: DOCKERFILE
    environment:
      - POSTGRES_DBSTRING=postgres://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/TaskTide?sslmode=disable
      - API_HOST=0.0.0.0
      - API_PORT=${API_PORT}
      - QUEUE_HOST=queue
      - QUEUE_PORT=${QUEUE_PORT}
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - FILES_BUCKET_NAME=${FILES_BUCKET_NAME}
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      migration:
        condition: service_completed_successfully
      minio:
        condition: service_started

  queue:
    build: 
      context: .
      args:
        - APP_NAME=queue
      dockerfile: DOCKERFILE
    environment:
      - POSTGRES_DBSTRING=postgres://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/TaskTide?sslmode=disable
      - QUEUE_HOST=0.0.0.0
      - QUEUE_PORT=${QUEUE_PORT}
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - FILES_BUCKET_NAME=${FILES_BUCKET_NAME}
    ports:
      - "${QUEUE_PORT}:${QUEUE_PORT}"
    depends_on:
      migration:
        condition: service_completed_successfully
      minio:
        condition: service_started

  worker:
    build: 
      context: .
      args:
        - APP_NAME=worker
      dockerfile: DOCKERFILE
    environment:
      - QUEUE_HOST=queue
      - QUEUE_PORT=${QUEUE_PORT}
      - WORKER_HOST=
      - NOOP_TIME=${NOOP_TIME}
      - ENABLE_TEST_SIMULATORS=${ENABLE_TEST_SIMULATORS}
    depends_on:
      queue:
        condition: service_started

  frontend:
    image: docker.io/library/nginx:alpine
    ports:
      - "3001:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      api:
        condition: service_started

volumes:
  TaskTide:
