services:
  postgres:
    image: docker.io/library/postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: TaskTide
    # Loopback-only: scripts/endToEnd.go verifies DB state directly via
    # POSTGRES_DBSTRING (localhost:55432) and host psql debugging benefits
    # from it; nothing else talks to postgres across the container network.
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - TaskTide:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: docker.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    # Loopback-only for object inspection/debugging by host tooling.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  migration:
    build:
      context: .
      dockerfile: migrations.DOCKERFILE
    volumes:
      - ./migrations:/app/migrations
    working_dir: /app
    environment:
      - GOOSE_DRIVER=postgres
      - GOOSE_DBSTRING=postgres://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/TaskTide?sslmode=disable
      - GOOSE_MIGRATION_DIR=migrations
    command: up
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: 
      context: .
      args:
        - APP_NAME=api
      dockerfile: DOCKERFILE
    environment:
      - POSTGRES_DBSTRING=postgres://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/TaskTide?sslmode=disable
      - API_HOST=0.0.0.0
      - API_PORT=${API_PORT}
      - QUEUE_HOST=queue
      - QUEUE_PORT=${QUEUE_PORT}
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - FILES_BUCKET_NAME=${FILES_BUCKET_NAME}
    # Loopback-only, consumed by host-side test tooling: the E2E harness
    # posts to http://localhost:${API_PORT}; browser traffic goes through
    # the frontend's /api reverse proxy instead of this port.
    ports:
      - "127.0.0.1:${API_PORT}:${API_PORT}"
    depends_on:
      migration:
        condition: service_completed_successfully
      minio:
        condition: service_started

  queue:
    build: 
      context: .
      args:
        - APP_NAME=queue
      dockerfile: DOCKERFILE
    environment:
      - POSTGRES_DBSTRING=postgres://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/TaskTide?sslmode=disable
      - QUEUE_HOST=0.0.0.0
      - QUEUE_PORT=${QUEUE_PORT}
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - FILES_BUCKET_NAME=${FILES_BUCKET_NAME}
    # Loopback-only host publishes for the test tooling shipped with this
    # repo: scripts/endToEnd.go and the CLI talk gRPC to 50051 (see its
    # comment) and the CLI/queue debugging uses the queue HTTP port.
    ports:
      - "127.0.0.1:${QUEUE_PORT}:${QUEUE_PORT}"
      - "127.0.0.1:50051:50051"
    depends_on:
      migration:
        condition: service_completed_successfully
      minio:
        condition: service_started

  worker:
    build: 
      context: .
      args:
        - APP_NAME=worker
      dockerfile: DOCKERFILE
    environment:
      - QUEUE_HOST=queue
      - QUEUE_PORT=${QUEUE_PORT}
      - WORKER_HOST=
      - NOOP_TIME=${NOOP_TIME}
      - ENABLE_TEST_SIMULATORS=${ENABLE_TEST_SIMULATORS}
    depends_on:
      queue:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      # Consumed by nginx.conf.template (envsubst) to reach the api service.
      # Same variable feeds the api service's listen port, so they stay in sync.
      - API_PORT=${API_PORT}
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      api:
        condition: service_started

volumes:
  TaskTide:
