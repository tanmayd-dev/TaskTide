syntax = "proto3";

package tasktide;

option go_package = "github.com/tanmayd-dev/TaskTide/internal/pb";

service TaskTideService {
    rpc RegisterWorker(RegisterRequest) returns (RegisterResponse);
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
    rpc PollJobs(PollRequest) returns (PollResponse);
    rpc CompleteJob(CompleteRequest) returns (CompleteResponse);
    rpc SubmitJob(SubmitRequest) returns (SubmitResponse);
    rpc ExtendLease(ExtendLeaseRequest) returns (ExtendLeaseResponse);
    rpc InspectQueue(InspectQueueRequest) returns (InspectQueueResponse);
    rpc RetryJob(RetryJobRequest) returns (RetryJobResponse);
    rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
    rpc PauseQueue(PauseQueueRequest) returns (PauseQueueResponse);
}

message RegisterRequest {
    string hostname = 1;
    string port = 2;
    int32 concurrency = 3;
    repeated string capabilities = 4;
}

message RegisterResponse {
    string worker_id = 1;
}

message HeartbeatRequest {
    string worker_id = 1;
}

message HeartbeatResponse {
    bool success = 1;
}

message PollRequest {
    string worker_id = 1;
    repeated string capabilities = 2;
    int32 free_slots = 3;
}

message Job {
    string id = 1;
    string queue_name = 2;
    string payload = 3;
    int32 retry_count = 4;
    int32 priority = 5;
    string task_execution_id = 6;
}

message PollResponse {
    repeated Job jobs = 1;
}

message CompleteRequest {
    string job_id = 1;
    string worker_id = 2;
    bool success = 3;
    string output_data = 4;
    string error_reason = 5;
}

message CompleteResponse {
    bool success = 1;
}

message SubmitRequest {
    string queue_name = 1;
    string payload_json = 2;
    int32 max_retries = 3;
    int32 delay_seconds = 4;
    int32 priority = 5;
    string idempotency_key = 6;
}

message SubmitResponse {
    string job_id = 1;
    string status = 2;
}

message ExtendLeaseRequest {
    string job_id = 1;
    string worker_id = 2;
    int32 extension_seconds = 3;
}

message ExtendLeaseResponse {
    bool success = 1;
}

message InspectQueueRequest {
    string queue_name = 1;
}

message InspectQueueResponse {
    string queue_name = 1;
    int64 pending = 2;
    int64 running = 3;
    int64 completed = 4;
    int64 failed = 5;
    int64 dead_letter = 6;
}

message RetryJobRequest {
    string job_id = 1;
}

message RetryJobResponse {
    string job_id = 1;
    string status = 2;
}

message ListWorkersRequest {
}

message WorkerStatus {
    string worker_id = 1;
    string host = 2;
    bool active = 3;
    int64 last_heartbeat = 4;
}

message ListWorkersResponse {
    repeated WorkerStatus workers = 1;
}

message PauseQueueRequest {
    string queue_name = 1;
    bool paused = 2;
}

message PauseQueueResponse {
    string queue_name = 1;
    bool paused = 2;
}
